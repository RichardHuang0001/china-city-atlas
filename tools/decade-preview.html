<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2016-2026 城市排名变迁组件 · 本地设计台</title>
  <link rel="stylesheet" href="../site/assets/style.css">
  <style>
    body { padding-bottom: 56px; }
    .bench-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 18px 40px;
    }
    .bench-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }
    .bench-top h1 {
      margin: 0;
      font-size: clamp(22px, 2.6vw, 30px);
      color: var(--wine);
      letter-spacing: -0.03em;
    }
    .bench-top p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      max-width: 70ch;
      line-height: 1.55;
    }
    .bench-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .bench-controls label {
      font-size: 13px;
      color: var(--muted);
    }
    .bench-controls select {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
    }
    .bench-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
      margin-inline-start: auto;
    }
    .bench-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch-box {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      display: inline-block;
    }
    .swatch-dash {
      width: 14px;
      height: 0;
      border-top: 1.5px dashed #7a4b58;
      display: inline-block;
    }

    /* ======== 核心组件：2016-2026 排名动态区间长方形柱状图 ======== */
    .decade-box {
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #fffcf7;
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      box-shadow: 0 2px 10px #75405108;
    }
    .decade-box-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 10px;
    }
    .decade-box-title {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
    }
    .decade-box-title h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 760;
      letter-spacing: 0.02em;
      color: var(--wine);
      font-variant-numeric: tabular-nums;
    }
    .decade-city-tag {
      font-size: 12.5px;
      font-weight: 650;
      color: var(--ink);
    }
    .decade-tier-pill {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--rose);
      color: var(--wine);
      font-weight: 600;
    }
    .decade-kpis {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .decade-lvl {
      font-weight: 760;
      color: var(--ink);
    }
    .decade-delta {
      padding: 1px 6px;
      border-radius: 6px;
      font-weight: 680;
      font-size: 11px;
    }
    .decade-delta.is-up { background: #f8e5e8; color: #9b3454; }
    .decade-delta.is-mild-down { background: #f6ecec; color: #8a5661; }
    .decade-delta.is-down { background: #ece9ed; color: #5d5663; }
    .decade-delta.is-flat { background: #f2ece4; color: #75655b; }
    .decade-readout {
      min-height: 18px;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .decade-readout strong {
      color: var(--ink);
      font-weight: 660;
    }

    .decade-plot {
      position: relative;
      height: 118px;
      border: 1px solid #e7d9ce;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(155, 52, 84, 0.025) 0%, rgba(130, 103, 78, 0.02) 100%);
      padding: 10px 9px 0 38px;
      display: flex;
      align-items: flex-end;
    }
    .decade-guides {
      position: absolute;
      inset: 10px 9px 0 38px;
      pointer-events: none;
    }
    .decade-guide {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px dotted #dfd0c4;
    }
    .decade-guide span {
      position: absolute;
      left: -35px;
      top: -7px;
      width: 31px;
      text-align: right;
      font-size: 9.5px;
      color: #8f7f74;
      font-variant-numeric: tabular-nums;
    }
    .decade-base-line {
      position: absolute;
      left: -4px;
      right: 0;
      border-top: 1.5px dashed rgba(98, 62, 73, 0.72);
      z-index: 2;
      pointer-events: none;
    }
    .decade-base-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: -3.5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7a4b58;
    }

    .decade-bars {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 4px;
      align-items: end;
    }
    .decade-bar-col {
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      position: relative;
      border: 0;
      padding: 0;
      background: transparent;
    }
    .decade-bar-track {
      width: 100%;
      max-width: 22px;
      border-radius: 3.5px 3.5px 1.5px 1.5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: transform 0.14s ease, filter 0.14s ease;
      position: relative;
      background: #9b3454;
    }
    .decade-bar-col:hover .decade-bar-track,
    .decade-bar-col.is-active .decade-bar-track {
      transform: scaleY(1.02);
      filter: brightness(1.06);
      box-shadow: 0 0 0 1.5px rgba(155, 52, 84, 0.45);
    }
    .decade-bar-col.is-latest .decade-bar-track {
      box-shadow: 0 0 0 1px rgba(155, 52, 84, 0.35);
    }
    .decade-seg-lift {
      width: 100%;
      background: linear-gradient(180deg, #eb7884 0%, #d45567 100%);
      border-bottom: 1px solid rgba(255, 252, 247, 0.72);
      flex: 0 0 auto;
    }
    .decade-seg-base {
      width: 100%;
      background: linear-gradient(180deg, #983953 0%, #7d253d 100%);
      flex: 1 1 auto;
    }
    .decade-seg-deficit {
      width: 100%;
      background: repeating-linear-gradient(
        -45deg,
        rgba(140, 130, 143, 0.15),
        rgba(140, 130, 143, 0.15) 3px,
        rgba(140, 130, 143, 0.04) 3px,
        rgba(140, 130, 143, 0.04) 6px
      );
      border-top: 1px solid rgba(117, 108, 120, 0.42);
      flex: 0 0 auto;
    }
    .decade-bar-col.is-dip .decade-bar-track {
      background: transparent;
    }
    .decade-bar-col.is-dip .decade-seg-base {
      background: linear-gradient(180deg, #988e9c 0%, #756c78 100%);
      border-radius: 2px 2px 1.5px 1.5px;
    }

    .decade-x-axis {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 4px;
      padding: 0 9px 0 38px;
      font-size: 9.5px;
      color: var(--muted);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .decade-x-axis span.is-latest {
      color: var(--wine);
      font-weight: 720;
    }
    .decade-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid #f0e6dc;
      padding-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      margin: 22px 0 10px;
      font-size: 15px;
      font-weight: 720;
      color: var(--ink);
    }
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .single-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .detail-mock {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      padding: 14px 16px;
    }
    .detail-mock h4 { margin: 0 0 8px; font-size: 14px; color: var(--wine); }
    .detail-mock ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    @media (max-width: 960px) {
      .compare-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .single-wrap { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 600px) {
      .compare-grid { grid-template-columns: minmax(0, 1fr); }
      .decade-plot { height: 108px; padding-left: 34px; }
      .decade-guides { inset: 10px 9px 0 34px; }
      .decade-guide span { left: -32px; width: 28px; }
      .decade-x-axis { padding-left: 34px; font-size: 9px; }
    }
  </style>
</head>
<body>
<div class="bench-shell">
  <header class="bench-top">
    <div>
      <h1>2016–2026 城市全国排名变迁组件（本地设计台）</h1>
      <p>
        采用 2016–2026 年共 <strong>11 个年度版次</strong>（最后一柱为 <strong>2026 年版</strong>）知城全国总榜位次。取消全局固定水位压制，让每座城市均在各自历史排名区间内自适应拉伸，左侧纵轴直接显示全国排名（数值越小位置越高），放大呈现每一年的进退起伏。
      </p>
    </div>
  </header>

  <div class="bench-controls">
    <label for="city-picker">单城精细查看：</label>
    <select id="city-picker"></select>
    <div class="bench-legend" aria-label="图例">
      <span><i class="swatch-box" style="background:#953650"></i>持平/底盘位次</span>
      <span><i class="swatch-box" style="background:#eb7884"></i>优于 2016 排名抬升</span>
      <span><i class="swatch-box" style="background:#8c828f"></i>低于 2016 排名回落</span>
      <span><i class="swatch-dash"></i>2016 起步名次线</span>
    </div>
  </div>

  <div class="single-wrap">
    <div id="single-slot"></div>
    <aside class="detail-mock" id="city-audit-note"></aside>
  </div>

  <h2 class="section-title">跨六档与升降对照（2016–2026 全部 11 年排名波动直观放大）</h2>
  <div class="compare-grid" id="compare-grid"></div>
</div>

<script src="../site/assets/data.js"></script>
<script src="../site/assets/city-decade-ranks.js"></script>
<script>
(() => {
  const {cities, provinces} = window.atlasData;
  const decade = window.atlasDecadeRanks.cities || window.atlasDecadeRanks;
  const YEARS = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
  const TIER_NAMES = ['一线', '新一线', '二线', '三线', '四线', '五线'];
  const cityByCode = new Map(cities.map(c => [c[1], c]));

  const picker = document.getElementById('city-picker');
  const sortedCities = [...cities].sort((a, b) => a[3] - b[3] || a[4] - b[4]);
  for (const c of sortedCities) {
    picker.add(new Option(`${c[0]}（${provinces[c[2]]} · ${TIER_NAMES[c[3]]}）`, c[1]));
  }

  // Compute dynamic Y-axis [yTop (best), yBottom (worst)] tightly around a city's rank band
  function rankEnvelope(ranks) {
    const best = Math.min(...ranks);
    const worst = Math.max(...ranks);
    const span = worst - best;
    if (span === 0) {
      // Constant rank (e.g. Chengdu #5 every year): show symmetric window around it
      const pad = Math.max(4, Math.min(8, Math.round(best * 0.8)));
      const yTop = Math.max(1, best - pad);
      const yBottom = Math.min(337, yTop + pad * 2);
      return {best, worst, yTop, yBottom};
    }
    const padTop = Math.max(1, Math.min(18, Math.ceil(span * 0.22)));
    const padBot = Math.max(2, Math.min(20, Math.ceil(span * 0.28)));
    let yTop = Math.max(1, best - padTop);
    let yBottom = Math.min(337, worst + padBot);
    if (yBottom - yTop < 4) {
      yBottom = Math.min(337, yTop + 4);
      yTop = Math.max(1, yBottom - 4);
    }
    return {best, worst, yTop, yBottom};
  }

  // Map rank r into visual bar height [14% .. 92%] inside [yTop .. yBottom]
  const rankHeightPct = (r, yTop, yBottom) => 14 + 78 * ((yBottom - r) / (yBottom - yTop));

  function mixHex(a, b, t) {
    const k = Math.max(0, Math.min(1, t));
    const pa = i => parseInt(a.slice(i, i + 2), 16);
    const pb = i => parseInt(b.slice(i, i + 2), 16);
    const ch = (v1, v2) => Math.round(v1 + (v2 - v1) * k).toString(16).padStart(2, '0');
    return '#' + ch(pa(1), pb(1)) + ch(pa(3), pb(3)) + ch(pa(5), pb(5));
  }

  function rankDropSeverity(rk, rStart) {
    if (rk <= rStart) return 0;
    const dropAbs = rk - rStart;
    const dropRel = dropAbs / Math.max(15, rStart);
    return Math.max(0, Math.min(1, ((dropAbs - 2) / 38) * 0.55 + (dropRel / 0.85) * 0.45));
  }

  function createDecadeCard(code, showCityName = true) {
    const city = cityByCode.get(code);
    const entry = decade[code];
    if (!city || !entry) return document.createElement('div');
    const [ranks, tiers, realMult] = entry;
    const {best, worst, yTop, yBottom} = rankEnvelope(ranks);
    const rStart = ranks[0];
    const rEnd = ranks[10];
    const delta = rStart - rEnd; // positive = climbed ranks
    const endSev = rankDropSeverity(rEnd, rStart);
    const deltaClass = delta > 0 ? 'is-up' : delta === 0 ? 'is-flat' : endSev >= 0.45 ? 'is-down' : 'is-mild-down';
    const deltaText = delta > 0 ? `↑${delta}位` : delta < 0 ? `↓${Math.abs(delta)}位` : '持平';

    const baseHeight = rankHeightPct(rStart, yTop, yBottom);
    const midRank = Math.round((yTop + yBottom) / 2);
    const topGuidePct = rankHeightPct(yTop, yTop, yBottom);
    const midGuidePct = rankHeightPct(midRank, yTop, yBottom);
    const botGuidePct = rankHeightPct(yBottom, yTop, yBottom);

    const multNote = realMult ? ` · 16–25实增 ${realMult.toFixed(2)}×` : '';
    const defaultReadout = `2016 #${rStart} → 2026 #${rEnd} · 十年区间 #${best}–#${worst}${multNote}`;

    const card = document.createElement('section');
    card.className = 'decade-box';
    card.setAttribute('aria-label', `${city[0]} 2016-2026 全国排名柱状图`);
    card.innerHTML = `
      <div class="decade-box-head">
        <div class="decade-box-title">
          <h3>2016-2026</h3>
          ${showCityName ? `<span class="decade-city-tag">${city[0]}</span><span class="decade-tier-pill">${tiers[10]}</span>` : ''}
        </div>
        <div class="decade-kpis">
          <span class="decade-lvl">第 ${rEnd} 名</span>
          <span class="decade-delta ${deltaClass}">${deltaText}</span>
        </div>
      </div>
      <div class="decade-readout">${defaultReadout}</div>
      <div class="decade-plot">
        <div class="decade-guides" aria-hidden="true">
          <div class="decade-guide" style="bottom:${topGuidePct.toFixed(1)}%"><span>#${yTop}</span></div>
          ${midRank !== yTop && midRank !== yBottom ? `<div class="decade-guide" style="bottom:${midGuidePct.toFixed(1)}%"><span>#${midRank}</span></div>` : ''}
          <div class="decade-guide" style="bottom:${botGuidePct.toFixed(1)}%"><span>#${yBottom}</span></div>
          <div class="decade-base-line" style="bottom:${baseHeight.toFixed(2)}%"></div>
        </div>
        <div class="decade-bars"></div>
      </div>
      <div class="decade-x-axis" aria-hidden="true">
        ${YEARS.map((y, idx) => `<span class="${idx === 10 ? 'is-latest' : ''}">'${String(y).slice(2)}</span>`).join('')}
      </div>
      <div class="decade-foot">
        <span>纵轴：全国排名（越高越靠前）</span>
        <span>峰值 #${best} · 谷值 #${worst}</span>
      </div>
    `;

    const barsWrap = card.querySelector('.decade-bars');
    const readout = card.querySelector('.decade-readout');

    ranks.forEach((rk, idx) => {
      const h = rankHeightPct(rk, yTop, yBottom);
      const y = YEARS[idx];
      const tr = tiers[idx];
      const diff = rStart - rk;
      const diffStr = diff > 0 ? `（较16年 ↑${diff}）` : diff < 0 ? `（较16年 ↓${Math.abs(diff)}）` : '（与16年持平）';
      const tipText = `<strong>${y}年</strong> · 全国 <strong>第 ${rk} 名</strong>（${tr}）${idx > 0 ? diffStr : '· 起始基准'}`;

      const col = document.createElement('button');
      col.type = 'button';
      col.className = 'decade-bar-col' + (idx === 10 ? ' is-latest' : '') + (rk > rStart ? ' is-dip' : '');
      col.setAttribute('aria-label', `${y}年 第${rk}名`);

      const track = document.createElement('div');
      track.className = 'decade-bar-track';

      if (rk < rStart) {
        // Better rank -> taller bar with bright warm lift slice above 2016 dashed baseline
        track.style.height = h.toFixed(2) + '%';
        const gainT = Math.min(1, (rStart - rk) / 14);
        const liftPct = ((h - baseHeight) / h) * 100;
        const liftSeg = document.createElement('span');
        liftSeg.className = 'decade-seg-lift';
        liftSeg.style.height = liftPct.toFixed(2) + '%';
        liftSeg.style.background = `linear-gradient(180deg, ${mixHex('#e78a94', '#e8556b', gainT)} 0%, ${mixHex('#d16b7a', '#cb3c54', gainT)} 100%)`;
        const baseSeg = document.createElement('span');
        baseSeg.className = 'decade-seg-base';
        track.append(liftSeg, baseSeg);
      } else if (rk > rStart) {
        // Worse rank -> mild dusty rose first, gradual shift to slate grey only on large drops
        const sev = rankDropSeverity(rk, rStart);
        let fillTop, fillBot;
        if (sev <= 0.45) {
          const k = sev / 0.45;
          fillTop = mixHex('#c88692', '#b07b87', k);
          fillBot = mixHex('#ae6977', '#945f6d', k);
        } else {
          const k = (sev - 0.45) / 0.55;
          fillTop = mixHex('#b07b87', '#958b98', k);
          fillBot = mixHex('#945f6d', '#756b78', k);
        }
        track.style.height = baseHeight.toFixed(2) + '%';
        const defPct = ((baseHeight - h) / baseHeight) * 100;
        const defSeg = document.createElement('span');
        defSeg.className = 'decade-seg-deficit';
        defSeg.style.height = defPct.toFixed(2) + '%';
        defSeg.style.opacity = (0.38 + 0.62 * sev).toFixed(2);
        const baseSeg = document.createElement('span');
        baseSeg.className = 'decade-seg-base';
        baseSeg.style.background = `linear-gradient(180deg, ${fillTop} 0%, ${fillBot} 100%)`;
        track.append(defSeg, baseSeg);
      } else {
        track.style.height = h.toFixed(2) + '%';
        const baseSeg = document.createElement('span');
        baseSeg.className = 'decade-seg-base';
        track.append(baseSeg);
      }

      col.append(track);
      const showTip = () => {
        for (const el of barsWrap.children) el.classList.remove('is-active');
        col.classList.add('is-active');
        readout.innerHTML = tipText;
      };
      col.addEventListener('pointerenter', showTip);
      col.addEventListener('focus', showTip);
      col.addEventListener('click', showTip);
      barsWrap.append(col);
    });

    card.querySelector('.decade-plot').addEventListener('pointerleave', () => {
      for (const el of barsWrap.children) el.classList.remove('is-active');
      readout.textContent = defaultReadout;
    });

    return card;
  }

  function renderSingle(code) {
    const city = cityByCode.get(code);
    const [ranks, tiers, realMult] = decade[code];
    const best = Math.min(...ranks);
    const worst = Math.max(...ranks);
    const delta = ranks[0] - ranks[10];
    document.getElementById('single-slot').replaceChildren(createDecadeCard(code, true));
    document.getElementById('city-audit-note').innerHTML = `
      <h4>${city[0]}（${provinces[city[2]]} · 2026版 ${tiers[10]}）十一年位次核对</h4>
      <ul>
        <li><strong>2016 → 2026 排名：</strong>#${ranks[0]}（${tiers[0]}） → <b>#${ranks[10]}（${tiers[10]}）</b>（净变化 <b>${delta > 0 ? '↑' + delta : delta < 0 ? '↓' + Math.abs(delta) : '持平'}</b>）</li>
        <li><strong>历史波动区间：</strong>最高第 #${best} 名 ～ 最低第 #${worst} 名（跨度 ${worst - best} 位）</li>
        <li><strong>左纵轴逻辑：</strong>围绕该城专属排名区间动态展开，确保每年升降幅在矩形中充分放大</li>
        <li><strong>16–25 实际 GDP 倍数：</strong>${realMult ? `${realMult.toFixed(2)}×（剔除通胀与普查基数跳变参考）` : '暂无'}</li>
      </ul>
    `;
  }

  picker.value = '340100'; // 默认合肥，直观展示多年度爬坡
  renderSingle('340100');
